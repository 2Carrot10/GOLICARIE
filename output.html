<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      body {
        margin: 0;
        background: #0d0f14;
        font-family: monospace;
      }
      #sigma {
        width: 100vw;
        height: 100vh;
      }
      #controls {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 12px;
        background: #13161e;
        border: 1px solid #1e2330;
        padding: 10px 16px;
        border-radius: 6px;
        color: #c8d0e0;
        font-size: 12px;
      }
      button {
        background: #1e2330;
        color: #c8d0e0;
        border: 1px solid #2a3040;
        padding: 4px 12px;
        cursor: pointer;
        font-family: monospace;
        font-size: 12px;
        border-radius: 3px;
      }
      button:hover {
        background: #2a3040;
      }
      button:disabled {
        opacity: 0.3;
        cursor: default;
      }
    </style>
  </head>
  <body>
    <div id="sigma"></div>
    <div id="controls">
      <button id="prev">← prev</button>
      <span id="step-label">step 0 / 0</span>
      <button id="next">next →</button>
    </div>
    <script type="module">
      import Graph from "https://esm.sh/graphology@0.25.4";
      import Sigma from "https://esm.sh/sigma@3.0.0-beta.25";
      import { circular } from "https://esm.sh/graphology-layout@0.6.1";
      import forceAtlas2 from "https://esm.sh/graphology-layout-forceatlas2@0.10.1";

      const COLORS = { Z: "#4af0c4", S: "#f0a44a", P: "#a44af0", T: "#f04a6a" }; // Totally need to do this better. Probably even interping it in
      const snapshots = [{"nodes":[{"id":"ada9e6c4___S$0","clss":"S","name":"0"},{"id":"f4817c45___Z$0","clss":"Z","name":"0"},{"id":"3d234bf6___P$0","clss":"P","name":"0"},{"id":"4afbea81___S$1","clss":"S","name":"1"},{"id":"e912af7d___Z$1","clss":"Z","name":"1"},{"id":"b00dec59___S$2","clss":"S","name":"2"},{"id":"2d53d446___Z$2","clss":"Z","name":"2"}],"edges":[{"id":"f4817c45___Z$0.r<>ada9e6c4___S$0.n","source":"ada9e6c4___S$0","target":"f4817c45___Z$0","left_port":"r","right_port":"n"},{"id":"3d234bf6___P$0.arg1<>ada9e6c4___S$0.r","source":"ada9e6c4___S$0","target":"3d234bf6___P$0","left_port":"arg1","right_port":"r"},{"id":"e912af7d___Z$1.r<>4afbea81___S$1.n","source":"4afbea81___S$1","target":"e912af7d___Z$1","left_port":"r","right_port":"n"},{"id":"b00dec59___S$2.n<>4afbea81___S$1.r","source":"4afbea81___S$1","target":"b00dec59___S$2","left_port":"n","right_port":"r"},{"id":"3d234bf6___P$0.arg2<>b00dec59___S$2.r","source":"b00dec59___S$2","target":"3d234bf6___P$0","left_port":"arg2","right_port":"r"},{"id":"3d234bf6___P$0.r<>2d53d446___Z$2.r","source":"2d53d446___Z$2","target":"3d234bf6___P$0","left_port":"r","right_port":"r"}]},{"nodes":[{"id":"f4817c45___Z$0","clss":"Z","name":"0"},{"id":"4afbea81___S$1","clss":"S","name":"1"},{"id":"e912af7d___Z$1","clss":"Z","name":"1"},{"id":"b00dec59___S$2","clss":"S","name":"2"},{"id":"2d53d446___Z$2","clss":"Z","name":"2"},{"id":"3dea71d5___P$1","clss":"P","name":"1"},{"id":"a3aac26b___S$1","clss":"S","name":"1"}],"edges":[{"id":"e912af7d___Z$1.r<>4afbea81___S$1.n","source":"4afbea81___S$1","target":"e912af7d___Z$1","left_port":"r","right_port":"n"},{"id":"b00dec59___S$2.n<>4afbea81___S$1.r","source":"4afbea81___S$1","target":"b00dec59___S$2","left_port":"n","right_port":"r"},{"id":"3dea71d5___P$1.r<>2d53d446___Z$2.r","source":"2d53d446___Z$2","target":"3dea71d5___P$1","left_port":"r","right_port":"r"},{"id":"f4817c45___Z$0.n<>3dea71d5___P$1.arg1","source":"3dea71d5___P$1","target":"f4817c45___Z$0","left_port":"n","right_port":"arg1"},{"id":"a3aac26b___S$1.r<>3dea71d5___P$1.arg2","source":"3dea71d5___P$1","target":"a3aac26b___S$1","left_port":"r","right_port":"arg2"},{"id":"b00dec59___S$2.arg2<>a3aac26b___S$1.n","source":"a3aac26b___S$1","target":"b00dec59___S$2","left_port":"arg2","right_port":"n"}]}];

      let step = 0;
      let renderer = null;

      function buildGraph(data) {
        const graph = new Graph({ type: "undirected", multi: true });
        for (const node of data.nodes) {
          graph.addNode(node.id, {
            label: `${node.clss}$${node.name}`,
            color: COLORS[node.clss] ?? "#888",
            size: 14,
            x: Math.random(),
            y: Math.random(),
          });
        }
        for (const edge of data.edges) {
          graph.addEdgeWithKey(edge.id, edge.source, edge.target, {
            size: 2,
            color: "#2a3040",
            label: `${edge.right_port} ↔ ${edge.left_port}`,
          });
        }
        circular.assign(graph, { scale: 150 });
        forceAtlas2.assign(graph, {
          iterations: 300,
          settings: forceAtlas2.inferSettings(graph),
        });
        return graph;
      }

      function render(s) {
        if (renderer) renderer.kill();
        const graph = buildGraph(snapshots[s]);
        renderer = new Sigma(graph, document.getElementById("sigma"), {
          labelFont: "monospace",
          labelColor: { color: "#c8d0e0" },
          renderEdgeLabels: true,
          edgeLabelFont: "monospace",
          edgeLabelColor: { color: "#5a6070" },
        });
        document.getElementById("step-label").textContent =
          `step ${s} / ${snapshots.length - 1}`;
        document.getElementById("prev").disabled = s === 0;
        document.getElementById("next").disabled = s === snapshots.length - 1;
      }

      document.getElementById("prev").onclick = () => render(--step);
      document.getElementById("next").onclick = () => render(++step);

      render(0);
    </script>
  </body>
</html>
